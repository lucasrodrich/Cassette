name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken local links, assets and dead external links
        run: npx --yes linkinator index.html signIn.html signUp.html
