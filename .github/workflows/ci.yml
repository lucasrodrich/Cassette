name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken local links, assets and dead external links
        # instagram.com is skipped: it 429s automated requests from CI IP
        # ranges regardless of whether the profile is real, so it can't be
        # checked reliably here - not the same thing as a broken link.
        run: npx --yes linkinator index.html signIn.html signUp.html --skip "instagram\.com"
